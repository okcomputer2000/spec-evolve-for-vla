[project]
name = "vla-safety-lab"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "z3-solver>=4.13,<5", "rtamt==0.4.10", "pillow>=11,<13", "tokenizers>=0.22,<0.23"]

[project.scripts]
semantic-guard = "safety_guard.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safety_guard*"]
